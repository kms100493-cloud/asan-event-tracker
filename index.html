<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>오늘의 서울아산병원 · 행사 목록</title>
<style>
body{font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;margin:0;background:#f5f7f6;color:#1d2b28}
header{background:#1f4d44;color:#fff;padding:20px 24px}
h1{margin:0;font-size:22px}
.meta{opacity:.85;font-size:13px;margin-top:6px}
main{padding:20px 24px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
button.f{border:1px solid #b9cbc6;background:#fff;padding:6px 12px;border-radius:16px;cursor:pointer;font-size:14px}
button.f.on{background:#1f4d44;color:#fff;border-color:#1f4d44}
input{padding:7px 10px;border:1px solid #b9cbc6;border-radius:8px;min-width:240px;font-size:14px}
.wrap{overflow:auto;background:#fff;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 10px;border-bottom:1px solid #e3ebe8;text-align:left;font-size:14px;vertical-align:top}
th{background:#eef5f2;position:sticky;top:0;white-space:nowrap}
td.g{font-weight:700;white-space:nowrap}
.g-상{color:#b42318}.g-중{color:#b54708}.g-하{color:#475467}.g-미표기{color:#98a2b3}
a{color:#1f4d44}
</style>
</head>
<body>
<header>
  <h1>오늘의 서울아산병원 · 행사 목록</h1>
  <div class="meta" id="meta">불러오는 중…</div>
</header>
<main>
  <div class="filters">
    <button class="f on" data-g="">전체</button>
    <button class="f" data-g="상">상</button>
    <button class="f" data-g="중">중</button>
    <button class="f" data-g="하">하</button>
    <button class="f" data-g="미표기">미표기</button>
    <input id="q" placeholder="행사명·담당자 검색">
  </div>
  <div class="wrap">
    <table>
      <thead><tr id="head"></tr></thead>
      <tbody id="body"></tbody>
    </table>
  </div>
</main>
<script>
const SRC = 'data/events.md';
let headers = [], rows = [], grade = '', query = '';

function splitRow(line) {
  return line.trim().replace(/^\||\|$/g, '').split(/(?<!\\)\|/)
    .map(s => s.replace(/\\\|/g, '|').trim());
}

function parse(md) {
  const lines = md.split('\n').filter(l => l.trim().startsWith('|'));
  headers = splitRow(lines[0]);
  rows = lines.slice(2).map(splitRow).filter(r => r[0]);
}

function render() {
  const iG = headers.indexOf('사보 중요도');
  document.getElementById('head').innerHTML = headers.map(h => `<th>${h}</th>`).join('');

  const list = rows.filter(r => {
    const g = (r[iG] || '').trim() || '미표기';
    if (grade && g !== grade) return false;
    if (query && !r.join(' ').toLowerCase().includes(query)) return false;
    return true;
  });

  document.getElementById('body').innerHTML = list.map(r => '<tr>' + headers.map((h, i) => {
    const v = r[i] || '';
    if (i === iG) return `<td class="g g-${v || '미표기'}">${v || '미표기'}</td>`;
    if (/^https?:\/\//.test(v)) return `<td><a href="${v}" target="_blank" rel="noopener">링크</a></td>`;
    return `<td>${v}</td>`;
  }).join('') + '</tr>').join('');

  document.getElementById('meta').textContent =
    `전체 ${rows.length}건 · 표시 ${list.length}건 · 화면 갱신 ${new Date().toLocaleString('ko-KR')}`;
}

async function load() {
  try {
    const res = await fetch(SRC + '?t=' + Date.now(), { cache: 'no-store' });
    parse(await res.text());
    render();
  } catch (e) {
    document.getElementById('meta').textContent = '데이터를 불러오지 못했습니다. 잠시 후 새로고침하세요.';
  }
}

document.querySelectorAll('button.f').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('button.f').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  grade = b.dataset.g;
  render();
}));
document.getElementById('q').addEventListener('input', e => {
  query = e.target.value.trim().toLowerCase();
  render();
});

load();
setInterval(load, 5 * 60 * 1000);
</script>
</body>
</html>
