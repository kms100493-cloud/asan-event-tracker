<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>오늘의 서울아산병원</title>
<style>
:root{--bg:#fff;--fg:#191919;--mut:#6b6b6b;--line:#ececec;--brand:#ba5b3c;--primary:#191919;--surf:#faf9f7;
--상:#ba5b3c;--중:#c98a2b;--하:#6b7280;--미표기:#b5b5b5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",system-ui,sans-serif;font-size:15px}
header{padding:28px 32px 18px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:24px;font-weight:600;letter-spacing:-.2px}
.sub{color:var(--mut);font-size:13px;margin-top:6px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:16px 32px;border-bottom:1px solid var(--line);background:var(--surf)}
.group{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.lbl{color:var(--mut);font-size:12px;margin-right:4px}
.pill{border:1px solid #d9d9d9;background:#fff;color:var(--fg);padding:6px 13px;border-radius:999px;cursor:pointer;font-size:13px;white-space:nowrap}
.pill:hover{background:#f2f2f2}
.pill.on{background:var(--primary);border-color:var(--primary);color:#fff}
.pill .n{opacity:.6;margin-left:4px;font-size:12px}
input[type=search]{padding:7px 12px;border:1px solid #d9d9d9;border-radius:8px;min-width:240px;font-size:13px;margin-left:auto}
main{padding:20px 32px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.card{border:1px solid var(--line);border-radius:12px;padding:16px 18px 14px 20px;position:relative;background:#fff}
.card:before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 3px 3px 0;background:var(--미표기)}
.card.상:before{background:var(--상)}.card.중:before{background:var(--중)}.card.하:before{background:var(--하)}
.top{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px}
.cat{font-size:12px;color:var(--mut)}
.tag{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;color:#fff;background:var(--미표기)}
.tag.상{background:var(--상)}.tag.중{background:var(--중)}.tag.하{background:var(--하)}
.title{font-size:16px;font-weight:600;line-height:1.4;margin:2px 0 8px}
.date{font-size:13px;color:var(--brand);font-weight:600;margin-bottom:8px}
.note{font-size:13px;color:#444;line-height:1.5;white-space:pre-wrap}
.who{font-size:12px;color:var(--mut);margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.hist{font-size:12px;color:var(--mut);margin-top:4px}
.links{margin-top:10px;display:flex;gap:10px;font-size:13px}
.links a{color:var(--primary);text-decoration:underline;text-underline-offset:3px}
.empty{color:var(--mut);padding:40px 0;text-align:center}
.meta{color:var(--mut);font-size:13px;margin-bottom:14px}
</style>
</head>
<body>
<header>
  <h1>오늘의 서울아산병원</h1>
  <div class="sub" id="sub">불러오는 중…</div>
</header>
<div class="bar">
  <div class="group">
    <span class="lbl">중요도</span>
    <button class="pill on" data-g="">전체 <span class="n" id="n-all"></span></button>
    <button class="pill" data-g="상">상 <span class="n" id="n-상"></span></button>
    <button class="pill" data-g="중">중 <span class="n" id="n-중"></span></button>
    <button class="pill" data-g="하">하 <span class="n" id="n-하"></span></button>
    <button class="pill" data-g="미표기">미표기 <span class="n" id="n-미표기"></span></button>
  </div>
  <div class="group">
    <span class="lbl">기간</span>
    <button class="pill on" data-p="all">전체</button>
    <button class="pill" data-p="today">오늘부터</button>
    <button class="pill" data-p="week">이번 주</button>
    <button class="pill" data-p="month">이번 달</button>
    <button class="pill" data-p="past">지난 행사</button>
  </div>
  <input type="search" id="q" placeholder="행사명·담당자 검색">
</div>
<main>
  <div class="meta" id="meta"></div>
  <div class="grid" id="grid"></div>
</main>
<script>
const SRC = 'data/events.md';
let headers = [], rows = [], grade = '', period = 'all', query = '';

const today = new Date(); today.setHours(0,0,0,0);
const ymd = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

function splitRow(line){
  return line.trim().replace(/^\||\|$/g,'').split(/(?<!\\)\|/).map(s=>s.replace(/\\\|/g,'|').trim());
}
function parse(md){
  const lines = md.split('\n').filter(l=>l.trim().startsWith('|'));
  headers = splitRow(lines[0]);
  rows = lines.slice(2).map(splitRow).filter(r=>r[0]).map(r=>{
    const o = {}; headers.forEach((h,i)=>o[h]=r[i]||''); return o;
  });
}
// 행사일 칸에서 첫 날짜를 꺼냄 (예: 2026-12-12~2026-12-13 → 2026-12-12)
function firstDate(s){
  const m = (s||'').match(/(\d{4})-(\d{2})-(\d{2})/);
  if(m) return new Date(+m[1], +m[2]-1, +m[3]);
  return null;
}
function lastDate(s){
  const all = [...(s||'').matchAll(/(\d{4})-(\d{2})-(\d{2})/g)];
  if(!all.length) return null;
  const m = all[all.length-1];
  return new Date(+m[1], +m[2]-1, +m[3]);
}
function inPeriod(r){
  const d = firstDate(r['행사일']);
  if(period==='all') return true;
  if(!d) return false;
  const end = lastDate(r['행사일']) || d;
  const weekStart = new Date(today); weekStart.setDate(today.getDate()-((today.getDay()+6)%7));
  const weekEnd = new Date(weekStart); weekEnd.setDate(weekStart.getDate()+6);
  const monthStart = new Date(today.getFullYear(), today.getMonth(), 1);
  const monthEnd = new Date(today.getFullYear(), today.getMonth()+1, 0);
  if(period==='today') return end>=today;
  if(period==='week') return d<=weekEnd && end>=weekStart;
  if(period==='month') return d<=monthEnd && end>=monthStart;
  if(period==='past') return end<today;
  return true;
}
const gradeOf = r => (r['사보 중요도']||'').trim() || '미표기';

function counts(){
  const c = {'상':0,'중':0,'하':0,'미표기':0};
  rows.forEach(r=>{ c[gradeOf(r)] = (c[gradeOf(r)]||0)+1; });
  document.getElementById('n-all').textContent = rows.length;
  ['상','중','하','미표기'].forEach(k=>document.getElementById('n-'+k).textContent = c[k]||0);
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function render(){
  const list = rows.filter(r=>{
    if(grade && gradeOf(r)!==grade) return false;
    if(!inPeriod(r)) return false;
    if(query && !Object.values(r).join(' ').toLowerCase().includes(query)) return false;
    return true;
  });
  document.getElementById('meta').textContent = `표시 ${list.length}건 (전체 ${rows.length}건)`;
  if(!list.length){ document.getElementById('grid').innerHTML = '<div class="empty">조건에 맞는 행사가 없습니다.</div>'; return; }
  document.getElementById('grid').innerHTML = list.map(r=>{
    const g = gradeOf(r);
    const cls = ['상','중','하'].includes(g) ? g : '';
    const links = r['출처 링크'] && /^https?:/.test(r['출처 링크']) ? `<a href="${esc(r['출처 링크'])}" target="_blank" rel="noopener">원문 보기</a>` : '';
    const hist = r['사보 이력 비교'] ? `<div class="hist">병원보 이력: ${esc(r['사보 이력 비교'])}</div>` : '';
    const who = [r['아산넷 등록자(게시글 올린 사람)'], r['행사 담당/문의(본문에 명시된 경우)']].filter(Boolean).map(esc).join(' · ');
    return `<article class="card ${cls}">
      <div class="top"><span class="cat">${esc(r['행사 분류']||'')}</span><span class="tag ${cls}">${g}</span></div>
      <div class="title">${esc(r['행사명']||'')}</div>
      <div class="date">${esc(r['행사일']||'')}</div>
      ${r['비고(공개 가능)'] ? `<div class="note">${esc(r['비고(공개 가능)'])}</div>` : ''}
      ${hist}
      ${who ? `<div class="who">${who}</div>` : ''}
      ${links ? `<div class="links">${links}</div>` : ''}
    </article>`;
  }).join('');
}

async function load(){
  try{
    const res = await fetch(SRC+'?t='+Date.now(), {cache:'no-store'});
    if(!res.ok) throw new Error(res.status);
    parse(await res.text());
    counts(); render();
    document.getElementById('sub').textContent = '마지막 확인 ' + new Date().toLocaleString('ko-KR');
  }catch(e){
    document.getElementById('sub').textContent = '데이터를 불러오지 못했습니다. 잠시 후 새로고침하세요.';
  }
}
document.querySelectorAll('[data-g]').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('[data-g]').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); grade = b.dataset.g; render();
}));
document.querySelectorAll('[data-p]').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('[data-p]').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); period = b.dataset.p; render();
}));
document.getElementById('q').addEventListener('input',e=>{ query = e.target.value.trim().toLowerCase(); render(); });
load();
setInterval(load, 5*60*1000);
</script>
</body>
</html>
